services:
  mongo:
    image: mongo:7
    container_name: doctor-tracker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: doctor-tracker-api
    ports:
      - "4000:4000"
    environment:
      - PORT=${PORT:-4000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/doctor-tracker}
      - JWT_SECRET=${JWT_SECRET:-064d8b0b83ea8a48d8928f22bf8c44a18c8e1ba8c3f0bd7a0c7754aa9db28d01}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: doctor-tracker-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      - NEXT_PUBLIC_OPEN_WEATHER_API_KEY=${NEXT_PUBLIC_OPEN_WEATHER_API_KEY}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - api

volumes:
  mongo-data:
